[project]
name = "footyviz"
version = "0.2.0"
description = "Turn an amateur football video (YouTube/Veo) into a tracked overlay + team stats."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1.0",
    "ultralytics>=8.3.0",     # YOLO11 detection
    "supervision>=0.22.0",    # ByteTrack + annotators
    "opencv-python>=4.9.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",          # parquet track store
    "pyyaml>=6.0",
    "scikit-learn>=1.4",      # M1 team assignment (KMeans over jersey colour)
    "scipy>=1.11",            # whistle detection (STFT)
    "boxmot>=16.0.11,<16.1",  # BoT-SORT + OSNet re-ID (API moved in 25.x; pinned)
    "imageio-ffmpeg>=0.5",    # bundled ffmpeg: clip cutting + H.264 output
]

[project.optional-dependencies]
# Layered in for M2+ (pitch homography, team embeddings, event detection).
stats = ["matplotlib>=3.8"]
events = ["easyocr>=1.7", "librosa>=0.10"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]          # optional local HTTP front (fv.api)
vlm = ["google-genai>=1.0", "openai>=1.30"]         # optional vision-LLM roster review
sr = ["spandrel>=0.4"]                              # Real-ESRGAN crops for the VLM layer

[project.scripts]
fv = "fv.pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
