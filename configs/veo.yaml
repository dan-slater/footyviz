# Defaults tuned for Veo auto-panning single-camera footage pulled from YouTube.
# CLI flags override anything here.

acquire:
  max_height: 1080          # Veo uploads are usually 1080p; bump to 1440/2160 if available.

detect:
  # M0 uses a COCO person detector (self-contained, no external weights/keys).
  # Upgrade path: swap for a football-specific model (players + ball + referee),
  # e.g. a Roboflow-trained YOLO checkpoint, then relax the person-only class filter.
  model: yolo11m.pt
  device: cuda:0            # zulzi-gpu. Use "cpu" locally (slow).
  conf: 0.30
  person_class_id: 0        # COCO "person"
  stride: 1                 # process every Nth frame (1 = all). Raise for a quick pass.

overlay:
  trace_length: 30          # frames of motion trail per player
  draw_traces: true

teams:                      # M1 - see fv.teams (CLI flags override)
  method: color             # color (implemented) | embedding (M4)
  samples_per_track: 30     # shirt crops sampled per track for its colour
  k: null                   # null = pick 3/4 by silhouette; or force an int

# --- Not wired yet; documents the intended M2-M4 knobs so the config is stable. ---
pitch:                      # M2 - per-frame homography (camera view moves every frame)
  enabled: false
events:                     # M3
  audio_candidates: true
  scoreboard_ocr: false     # Veo raw usually has no score bug

# Optional LLM/VLM enrichment layer. The whole pipeline (detect, track, teams,
# whistles) runs 100% without this — it is a pure add-on gated by `enabled`.
# When enabled: false, fv.llm.get_llm() returns None and every caller skips.
llm:
  enabled: false            # master switch — pipeline runs fully without it
  provider: gemini          # gemini | openai | local
  model: gemini-2.5-flash   # cheap/fast vision model; provider-specific
  uses:                     # granular per-feature switches (only apply when enabled: true)
    fingerprint: true       # rich appearance attributes for player identity
    events: true            # goal/assist classification on whistle clips
    scoreboard: false       # read the LED scoreboard (no board in this feed)
    report: true            # written match summary
